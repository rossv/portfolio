<svg width="78" height="78" viewBox="-7 -4 78 78" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Inner Drop Shadow -->
    <filter id="badge-bridge-builder_shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <!-- Glow -->
    <filter id="badge-bridge-builder_glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="badge-bridge-builder_inner_shadow">
      <feOffset dx="0" dy="2"/>
      <feGaussianBlur stdDeviation="2" result="offset-blur"/>
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
      <feFlood flood-color="black" flood-opacity="0.3" result="color"/>
      <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
      <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
    </filter>
    <!-- Background Gradient: river water under the deck -->
    <linearGradient id="badge-bridge-builder_bg" x1="10" y1="10" x2="54" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0D1A23"/>
      <stop offset="1" stop-color="#2E6070"/>
    </linearGradient>
    <!-- Outer Ring Gradient -->
    <linearGradient id="badge-bridge-builder_ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE9A8"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#B98A4B"/>
    </linearGradient>
    <clipPath id="badge-bridge-builder_face">
      <circle cx="32" cy="32" r="26"/>
    </clipPath>
  </defs>

  <!-- Outer Ring  -->
  <circle cx="32" cy="32" r="30" fill="url(#badge-bridge-builder_ring)" filter="url(#badge-bridge-builder_shadow)"/>

  <!-- Outer Ring Bevel -->
  <circle cx="32" cy="32" r="28" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1"/>
  <circle cx="32" cy="32" r="29" fill="none" stroke="#000000" stroke-opacity="0.4" stroke-width="1"/>

  <!-- Inner Background -->
  <circle cx="32" cy="32" r="26" fill="url(#badge-bridge-builder_bg)" filter="url(#badge-bridge-builder_inner_shadow)"/>

  <!-- Inner Highlight/Glass Curve -->
  <path d="M 10,32 A 22,22 0 0,1 54,32 A 22,12 0 0,0 10,32 Z" fill="#ffffff" opacity="0.15"/>
  <circle cx="32" cy="32" r="26" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1"/>

  <!-- Extra custom background shapes: rivets around the plate, and the
       waterline the span crosses. -->
  <g clip-path="url(#badge-bridge-builder_face)">
    <path d="M 6 46 H 58" stroke="#4E8494" stroke-opacity="0.45" stroke-width="1.4" fill="none"/>
    <g fill="#8FA1AE" fill-opacity="0.28">
      <circle cx="12" cy="14" r="1.5"/>
      <circle cx="52" cy="14" r="1.5"/>
      <circle cx="12" cy="53" r="1.5"/>
      <circle cx="52" cy="53" r="1.5"/>
    </g>
  </g>

  <!-- Icon Group: a self-anchored suspension span, cable, towers and hangers -->
  <g transform="translate(32, 34)" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- towers -->
    <path d="M -9 6 V -12 M 9 6 V -12" stroke="#C9D4DC" stroke-width="2.4"/>
    <!-- cable: down to each anchorage, catenary between the towers -->
    <path d="M -18 2 Q -13.5 -8 -9 -12 Q 0 -3.4 9 -12 Q 13.5 -8 18 2" stroke="#FFB612" stroke-width="2.4"/>
    <!-- hangers -->
    <path d="M -4.5 -6.6 V 2 M 0 -4.6 V 2 M 4.5 -6.6 V 2" stroke="#8FA1AE" stroke-opacity="0.85" stroke-width="1.2"/>
    <!-- deck -->
    <path d="M -19 2 H 19" stroke="#FFFFFF" stroke-width="2.6"/>
  </g>
</svg>
