<svg width="78" height="78" viewBox="-7 -4 78 78" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Inner Drop Shadow -->
    <filter id="badge-stargazer_shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <!-- Glow -->
    <filter id="badge-stargazer_glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="badge-stargazer_inner_shadow">
      <feOffset dx="0" dy="2"/>
      <feGaussianBlur stdDeviation="2" result="offset-blur"/>
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
      <feFlood flood-color="black" flood-opacity="0.3" result="color"/>
      <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
      <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
    </filter>
    <!-- Background Gradient: the violet a placed star is tinted with. -->
    <linearGradient id="badge-stargazer_bg" x1="10" y1="10" x2="54" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>
    <!-- Outer Ring Gradient -->
    <linearGradient id="badge-stargazer_ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DDD6FE"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>

  <!-- Outer Ring  -->
  <circle cx="32" cy="32" r="30" fill="url(#badge-stargazer_ring)" filter="url(#badge-stargazer_shadow)"/>

  <!-- Outer Ring Bevel -->
  <circle cx="32" cy="32" r="28" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1"/>
  <circle cx="32" cy="32" r="29" fill="none" stroke="#000000" stroke-opacity="0.4" stroke-width="1"/>

  <!-- Inner Background -->
  <circle cx="32" cy="32" r="26" fill="url(#badge-stargazer_bg)" filter="url(#badge-stargazer_inner_shadow)"/>

  <!-- Inner Highlight/Glass Curve -->
  <path d="M 10,32 A 22,22 0 0,1 54,32 A 22,12 0 0,0 10,32 Z" fill="#ffffff" opacity="0.15"/>
  <circle cx="32" cy="32" r="26" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1"/>

  <!-- Extra custom background shapes: the same scattered stars as the space
       nerd badge, so the pair reads as one family. -->
  <circle cx="19" cy="21" r="1.5" fill="#FFF" opacity="0.8"/>
  <circle cx="45" cy="19" r="1" fill="#FFF" opacity="0.6"/>
  <circle cx="48" cy="40" r="1.4" fill="#FFF" opacity="0.85"/>
  <circle cx="17" cy="43" r="1" fill="#FFF" opacity="0.65"/>
  <circle cx="36" cy="51" r="1" fill="#FFF" opacity="0.5"/>

  <!-- Icon Group -->
  <g transform="translate(18, 18) scale(1.16)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z" fill="none" stroke="#FFF" stroke-width="2"/><path d="M20 3v4" fill="none" stroke="#FFF" stroke-width="2"/><path d="M22 5h-4" fill="none" stroke="#FFF" stroke-width="2"/>
  </g>
</svg>
