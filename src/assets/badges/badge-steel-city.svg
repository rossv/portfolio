<svg width="78" height="78" viewBox="-7 -4 78 78" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Inner Drop Shadow -->
    <filter id="badge-steel-city_shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <!-- Glow -->
    <filter id="badge-steel-city_glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="badge-steel-city_inner_shadow">
      <feOffset dx="0" dy="2"/>
      <feGaussianBlur stdDeviation="2" result="offset-blur"/>
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
      <feFlood flood-color="black" flood-opacity="0.3" result="color"/>
      <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
      <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
    </filter>
    <!-- Background Gradient: the black of the palette, lifted just enough to
         read as a face rather than a hole. -->
    <linearGradient id="badge-steel-city_bg" x1="10" y1="10" x2="54" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A0E13"/>
      <stop offset="1" stop-color="#2A3642"/>
    </linearGradient>
    <!-- Outer Ring Gradient -->
    <linearGradient id="badge-steel-city_ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE9A8"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#B98A4B"/>
    </linearGradient>
    <clipPath id="badge-steel-city_face">
      <circle cx="32" cy="32" r="26"/>
    </clipPath>
  </defs>

  <!-- Outer Ring  -->
  <circle cx="32" cy="32" r="30" fill="url(#badge-steel-city_ring)" filter="url(#badge-steel-city_shadow)"/>

  <!-- Outer Ring Bevel -->
  <circle cx="32" cy="32" r="28" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1"/>
  <circle cx="32" cy="32" r="29" fill="none" stroke="#000000" stroke-opacity="0.4" stroke-width="1"/>

  <!-- Inner Background -->
  <circle cx="32" cy="32" r="26" fill="url(#badge-steel-city_bg)" filter="url(#badge-steel-city_inner_shadow)"/>

  <!-- Inner Highlight/Glass Curve -->
  <path d="M 10,32 A 22,22 0 0,1 54,32 A 22,12 0 0,0 10,32 Z" fill="#ffffff" opacity="0.15"/>
  <circle cx="32" cy="32" r="26" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1"/>

  <!-- Extra custom background shapes: three rivers meeting, the way the
       cartographer badge echoes its contours. -->
  <g clip-path="url(#badge-steel-city_face)" stroke="#4E8494" stroke-opacity="0.4" stroke-width="2.2" fill="none">
    <path d="M 4 18 Q 20 26 31 38"/>
    <path d="M 60 20 Q 44 28 33 38"/>
    <path d="M 32 38 L 32 60"/>
  </g>

  <!-- Icon Group: a keystone, cut and set -->
  <g transform="translate(32, 31)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M -8 -11 H 8 L 13 11 H -13 Z" fill="#FFB612" fill-opacity="0.18" stroke="#FFB612" stroke-width="2.4"/>
    <path d="M -10.6 3.5 H 10.6 M -9.2 -4 H 9.2" stroke="#FFB612" stroke-opacity="0.55" stroke-width="1.4"/>
  </g>
</svg>
