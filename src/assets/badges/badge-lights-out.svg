<svg width="78" height="78" viewBox="-7 -4 78 78" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Inner Drop Shadow -->
    <filter id="badge-lights-out_shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <!-- Glow -->
    <filter id="badge-lights-out_glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="badge-lights-out_inner_shadow">
      <feOffset dx="0" dy="2"/>
      <feGaussianBlur stdDeviation="2" result="offset-blur"/>
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
      <feFlood flood-color="black" flood-opacity="0.3" result="color"/>
      <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
      <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
    </filter>
    <!-- Background Gradient -->
    <linearGradient id="badge-lights-out_bg" x1="10" y1="10" x2="54" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="1" stop-color="#1E3A8A"/>
    </linearGradient>
    <!-- Outer Ring Gradient -->
    <linearGradient id="badge-lights-out_ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BAE6FD"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <!-- Half the face lit, half dark: the toggle itself. -->
    <clipPath id="badge-lights-out_face">
      <circle cx="32" cy="32" r="26"/>
    </clipPath>
  </defs>

  <!-- Outer Ring  -->
  <circle cx="32" cy="32" r="30" fill="url(#badge-lights-out_ring)" filter="url(#badge-lights-out_shadow)"/>

  <!-- Outer Ring Bevel -->
  <circle cx="32" cy="32" r="28" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1"/>
  <circle cx="32" cy="32" r="29" fill="none" stroke="#000000" stroke-opacity="0.4" stroke-width="1"/>

  <!-- Inner Background -->
  <circle cx="32" cy="32" r="26" fill="url(#badge-lights-out_bg)" filter="url(#badge-lights-out_inner_shadow)"/>

  <!-- Inner Highlight/Glass Curve -->
  <path d="M 10,32 A 22,22 0 0,1 54,32 A 22,12 0 0,0 10,32 Z" fill="#ffffff" opacity="0.15"/>
  <circle cx="32" cy="32" r="26" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1"/>

  <!-- Extra custom background shapes: a warm wash on the left, so the face
       carries both sides of the toggle. -->
  <g clip-path="url(#badge-lights-out_face)">
    <rect x="6" y="6" width="26" height="52" fill="#FBBF24" opacity="0.14"/>
  </g>

  <!-- Icon Group -->
  <g transform="translate(18, 18) scale(1.16)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9" fill="none" stroke="#FFF" stroke-width="2"/><path d="M20 3v4" fill="none" stroke="#FFF" stroke-width="2"/><path d="M22 5h-4" fill="none" stroke="#FFF" stroke-width="2"/>
  </g>
</svg>
