<svg width="78" height="78" viewBox="-7 -4 78 78" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Inner Drop Shadow -->
    <filter id="badge-pipeline_shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <!-- Glow -->
    <filter id="badge-pipeline_glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="badge-pipeline_inner_shadow">
      <feOffset dx="0" dy="2"/>
      <feGaussianBlur stdDeviation="2" result="offset-blur"/>
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
      <feFlood flood-color="black" flood-opacity="0.3" result="color"/>
      <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
      <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
    </filter>
    <!-- Background Gradient -->
    <linearGradient id="badge-pipeline_bg" x1="10" y1="10" x2="54" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#16222E"/>
      <stop offset="1" stop-color="#2B5B84"/>
    </linearGradient>
    <!-- Outer Ring Gradient -->
    <linearGradient id="badge-pipeline_ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE873"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#C9A227"/>
    </linearGradient>
    <clipPath id="badge-pipeline_face">
      <circle cx="32" cy="32" r="26"/>
    </clipPath>
  </defs>

  <!-- Outer Ring  -->
  <circle cx="32" cy="32" r="30" fill="url(#badge-pipeline_ring)" filter="url(#badge-pipeline_shadow)"/>

  <!-- Outer Ring Bevel -->
  <circle cx="32" cy="32" r="28" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1"/>
  <circle cx="32" cy="32" r="29" fill="none" stroke="#000000" stroke-opacity="0.4" stroke-width="1"/>

  <!-- Inner Background -->
  <circle cx="32" cy="32" r="26" fill="url(#badge-pipeline_bg)" filter="url(#badge-pipeline_inner_shadow)"/>

  <!-- Inner Highlight/Glass Curve -->
  <path d="M 10,32 A 22,22 0 0,1 54,32 A 22,12 0 0,0 10,32 Z" fill="#ffffff" opacity="0.15"/>
  <circle cx="32" cy="32" r="26" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1"/>

  <!-- Extra custom background shapes: dashed edges and packets, echoing the
       pipeline DAG running behind the technologist backdrop. -->
  <g clip-path="url(#badge-pipeline_face)">
    <path d="M 8 20 H 26 M 38 20 H 56" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="1" stroke-dasharray="3 3" fill="none"/>
    <path d="M 8 46 H 24 M 40 46 H 56" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="1" stroke-dasharray="3 3" fill="none"/>
    <circle cx="14" cy="20" r="1.4" fill="#FFE873" opacity="0.55"/>
    <circle cx="50" cy="46" r="1.4" fill="#FFE873" opacity="0.45"/>
  </g>

  <!-- Icon Group -->
  <g transform="translate(18, 18) scale(1.16)" stroke-linecap="round" stroke-linejoin="round">
    <line x1="6" y1="3" x2="6" y2="15" fill="none" stroke="#FFF" stroke-width="2"/><circle cx="18" cy="6" r="3" fill="none" stroke="#FFF" stroke-width="2"/><circle cx="6" cy="18" r="3" fill="none" stroke="#FFF" stroke-width="2"/><path d="M18 9a9 9 0 0 1-9 9" fill="none" stroke="#FFF" stroke-width="2"/>
  </g>
</svg>
