<svg width="78" height="78" viewBox="-7 -4 78 78" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Inner Drop Shadow -->
    <filter id="badge-bubbles-5000_shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <!-- Glow -->
    <filter id="badge-bubbles-5000_glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="badge-bubbles-5000_inner_shadow">
      <feOffset dx="0" dy="2"/>
      <feGaussianBlur stdDeviation="2" result="offset-blur"/>
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
      <feFlood flood-color="black" flood-opacity="0.3" result="color"/>
      <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
      <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
    </filter>
    <!-- Background Gradient: amber, matching this tier's chip accent. -->
    <linearGradient id="badge-bubbles-5000_bg" x1="10" y1="10" x2="54" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#92400E"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <!-- Outer Ring Gradient: gold, as the top of the track — the same signal
         Hour Mark carries with its glow. -->
    <linearGradient id="badge-bubbles-5000_ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#A16207"/>
    </linearGradient>
  </defs>

  <!-- Outer Ring  -->
  <circle cx="32" cy="32" r="30" fill="url(#badge-bubbles-5000_ring)" filter="url(#badge-bubbles-5000_shadow)"/>

  <!-- Outer Ring Bevel -->
  <circle cx="32" cy="32" r="28" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1"/>
  <circle cx="32" cy="32" r="29" fill="none" stroke="#000000" stroke-opacity="0.4" stroke-width="1"/>

  <!-- Inner Background -->
  <circle cx="32" cy="32" r="26" fill="url(#badge-bubbles-5000_bg)" filter="url(#badge-bubbles-5000_inner_shadow)"/>

  <!-- Inner Highlight/Glass Curve -->
  <path d="M 10,32 A 22,22 0 0,1 54,32 A 22,12 0 0,0 10,32 Z" fill="#ffffff" opacity="0.15"/>
  <circle cx="32" cy="32" r="26" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1"/>

  <!-- Extra custom background shapes if any -->


  <!-- Icon Group: the full three-bubble cluster, glowing as the top tier. -->
  <g transform="translate(18, 18) scale(1.16)" filter="url(#badge-bubbles-5000_glow)">
    <circle cx="6" cy="18" r="2" fill="none" stroke="#FFF" stroke-width="1.5"/><circle cx="18" cy="16" r="3" fill="none" stroke="#FFF" stroke-width="1.5"/><circle cx="12" cy="7" r="4" fill="none" stroke="#FFF" stroke-width="1.5"/><path d="M10 5a2 2 0 0 1 2 2" fill="none" stroke="#FFF" stroke-width="1.2" stroke-linecap="round"/>
  </g>
</svg>
